        active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Error:
      type: object
      properties:
        error: { type: string }
        details: {}
        upgrade_url: { type: string, format: uri, nullable: true }

  responses:

    Unauthorized:
      description: Invalid or missing API key
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error: "Invalid or missing API key"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error: "Not found"

    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error: "Validation failed"
            details:
              to: ["can't be blank"]

    PlanLimitReached:
      description: Plan limit reached
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error: "Business account limit reached for your plan (free)"
            details:
              limit: 1

    QuotaExceeded:
      description: Daily quota or rate limit exceeded
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error: "free_plan_limit_reached"
            upgrade_url: "https://whatsrb.com/pricing"
